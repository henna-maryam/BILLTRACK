services:
  postgres:
    image: postgres:17-alpine
    container_name: billtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: billtrack
    ports:
      - "5433:5432"
    volumes:
      - billtrack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d billtrack"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  billtrack-postgres-data:
